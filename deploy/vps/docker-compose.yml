# OpenWA — compose ringan untuk satu VPS (dipasang oleh deploy/vps/deploy.sh ke /opt/openwa).
# OpenWA (SQLite, image jadi dari GHCR, tidak build di VPS) + Caddy untuk HTTPS di depannya.
# Konfigurasi ada di /opt/openwa/.env; data (DB, sesi WhatsApp, media) di /opt/openwa/data.
services:
  openwa:
    image: ${OPENWA_IMAGE:-ghcr.io/rmyndharis/openwa:latest}
    container_name: openwa
    restart: unless-stopped
    stop_grace_period: 75s
    env_file: .env
    environment:
      PORT: 2785
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
    ports:
      # Hanya bisa diakses dari VPS itu sendiri (atau SSH tunnel); dari internet lewat Caddy (HTTPS).
      - '127.0.0.1:2785:2785'
    volumes:
      - ./data:/app/data
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add: # yang dibutuhkan entrypoint untuk chown data lalu turun ke user openwa
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${OPENWA_MEM_LIMIT:-1g}
    logging: &logging # batasi log biar disk VPS tidak penuh
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    container_name: openwa-caddy
    restart: unless-stopped
    depends_on:
      - openwa
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST belum diisi di .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data # sertifikat; jangan dihapus (Let's Encrypt membatasi penerbitan ulang)
    mem_limit: 128m
    logging: *logging
